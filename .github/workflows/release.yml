name: Windows release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          CARGO=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$CARGO" ]]; then
              echo "Tag v$VERSION does not match Cargo.toml version $CARGO"
              exit 1
            fi
          else
            VERSION="$CARGO"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/clipi.exe \
            "dist/clipi-${VERSION}-windows-x86_64.exe"
          (
            cd dist
            sha256sum "clipi-${VERSION}-windows-x86_64.exe" > SHA256SUMS.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: clipi-${{ steps.version.outputs.version }}-windows-x86_64
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "clipi ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
